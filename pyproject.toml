[project]
name = "disk-failure-self-healing-agent"
version = "0.1.0"
description = "Predictive disk-failure self-healing agent for server fleets, with a reliability/trust meta-validator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "polars>=1.9",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pandera[polars]>=0.20",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "optuna>=4.0",
    "mlflow>=2.16",
    "langgraph>=0.2",
    "redis>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",
    "streamlit>=1.39",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "requests>=2.34.2",
]

[project.optional-dependencies]
torch = ["torch>=2.4", "zarr>=2.18"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "UP042",  # keep `class X(str, Enum)` for pydantic v2 JSON-schema compatibility
    "B008",   # FastAPI's `Depends(...)` in argument defaults is the documented idiom
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
