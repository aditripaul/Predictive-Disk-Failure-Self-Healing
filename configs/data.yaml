raw_dir: data/raw
bronze_dir: data/bronze
silver_dir: data/silver
gold_dir: data/gold
audit_dir: data/audit

sources:
  backblaze:
    raw_glob: "data/raw/backblaze/*.csv"
    bronze_path: "data/bronze/backblaze"
    # Restricts which raw CSVs `make ingest-backblaze` processes (each is
    # named YYYY-MM-DD.csv), independent of which quarters you've already
    # downloaded - null (the default) ingests everything raw_glob matches.
    # Useful for keeping a single build-silver run's data volume bounded,
    # e.g. while validating on a smaller slice before ingesting more.
    start_date: "2026-01-01"
    end_date: "2026-03-31"
  smartz:
    raw_glob: "data/raw/smartz/*.csv"
    bronze_path: "data/bronze/smartz"
  synthetic:
    raw_glob: "data/raw/synthetic/*.parquet"
    bronze_path: "data/bronze/synthetic"

# Configurable raw-data download (docs/dataset_strategy.md section 3;
# `make download-backblaze` / `make download-smartz`,
# src/ingest/download.py). Backblaze publishes quarterly archives named
# "Q<n>_<year>" - configure the time period one of two ways (nothing here
# is a real default; pick whichever fits and fill it in yourself):
#   1. An explicit list:      quarters: ["Q1_2026", "Q2_2026"]
#   2. An inclusive range:    start_quarter: "Q1_2026"
#                             end_quarter:   "Q4_2026"
# `quarters` takes priority if both are set. Either can be overridden
# per-run without editing this file: --quarters / --start-quarter+--end-quarter.
download:
  backblaze:
    base_url: "https://f001.backblazeb2.com/file/Backblaze-Hard-Drive-Data"
    quarters: ["Q1_2026","Q2_2026"]
    start_quarter: null
    end_quarter: null
  smartz:
    # SMART-Z has no public bulk-download API - set this only once you've
    # requested access and have a direct archive URL.
    url: null

storage:
  format: parquet
  compression: zstd
  partition_by: ["source_dataset", "year", "month"]

telemetry_gap:
  short_gap_days: 3
  stale_gap_days: 7

feature_maturity:
  min_history_days: 30

# Process-wide memory cap (src/resource_limits.py): every pipeline/service
# entry point applies this as a hard OS-level limit (RLIMIT_AS, like
# `ulimit -v`) on its own process at startup. Hitting it usually aborts
# that process outright (Polars/PyArrow allocate in native code, not
# catchable Python memory errors) rather than letting a run silently
# consume all available RAM and swap. Set to null (or omit) to disable.
# POSIX only (no effect on Windows).
resource_limits:
  max_memory_gb: 20
  # `make build-features` computes features in batches of whole drives and
  # writes the output Parquet one batch at a time, so its peak memory is set
  # by this batch size rather than by the size of the dataset. Lower it if
  # you still hit the cap; raise it for fewer, larger batches. Batching is
  # on whole drives, so it never changes the resulting features (see
  # pipelines/build_gold_features.py::_write_wide_batches).
  feature_batch_target_rows: 2000000
  # `make train` joins the gold feature table to the label table in
  # batches of whole drives (both sides filtered to the same
  # hash(drive_id) bucket) rather than all at once - target rows per
  # batch, sized against gold features' own row count. Every one of the
  # ~196 feature columns is needed and there is no predicate to push into
  # the scan, so an unbatched join has to materialize the whole ~10GB
  # table (one month of real data); bounding only one side of the join
  # (an earlier version of this sliced gold features by row offset
  # alone) isn't enough either once the label table's own "one horizon,
  # observed only" subset stops being small at fleet scale - see
  # src/models/features.py::drive_batched_inner_join.
  training_join_chunk_rows: 2000000
  # `make build-silver` processes Bronze in batches of whole drives (by
  # hash of the normalized drive_id, so a drive's full history - possibly
  # spanning several Bronze files/months - always stays in one batch) and
  # writes each batch's drive_day output separately before combining them.
  # Lower it if you still hit the cap; raise it for fewer, larger batches.
  # See pipelines/build_silver.py's module docstring.
  silver_batch_target_rows: 2000000
  # `make build-labels` computes labels and applies splits in batches of
  # whole drives (by hash of drive_id, using a fleet-wide precomputed
  # drive-holdout set so every batch agrees on which drives are held out)
  # and writes each batch's label output separately before combining
  # them. Sized against drive-day row count, not the ~3x-larger (one row
  # per horizon) label row count. Lower it if you still hit the cap;
  # raise it for fewer, larger batches. See
  # pipelines/build_labels.py's module docstring.
  label_batch_target_rows: 2000000
