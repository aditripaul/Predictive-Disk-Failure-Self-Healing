version: 1

# Core error counters: each gets the FULL feature family (rolling stats, deltas,
# slopes, acceleration, positive/spike counts, zero-to-nonzero flags, model-family
# z-scores) - about 31 columns per attribute. Keep this list short: every entry
# widens the gold table and the training matrices by that much.
priority_smart_attributes:
  - reallocated_sector_count
  - current_pending_sector_count
  - offline_uncorrectable
  - reported_uncorrectable_errors
  - command_timeout
  # Added from the attribute screen (docs/adr/0002): separation 0.306 beats
  # four of the five above, and its ~66% coverage reaches the non-Seagate
  # drives where reported_uncorrectable_errors/command_timeout (~32%) are null.
  - reallocation_event_count

# Context attributes: each gets a LIGHT family only (current value plus its change
# over secondary_delta_windows_days observations). Missing for some drive models,
# so they are also left out of feature_confidence's attribute coverage.
secondary_smart_attributes:
  - seek_error_rate
  - power_on_hours
  - temperature_celsius
  - udma_crc_error_count
secondary_delta_windows_days: [7, 30]

windows_days: [7, 14, 30]

log1p_attributes:
  - reallocation_event_count
  - reallocated_sector_count
  - current_pending_sector_count
  - offline_uncorrectable
  - reported_uncorrectable_errors
  - command_timeout
  - spin_retry_count

clipping:
  lower_percentile: 0.01
  upper_percentile: 0.99

spike_thresholds:
  current_pending_sector_count: 10
  reallocated_sector_count: 5

feature_confidence:
  recency_tau_hours: 48
  # Telemetry arrives once a day in both Backblaze and SMART-Z, so a reading
  # one day after the previous one is perfectly fresh and must score 1.0.
  # Recency charges only the time BEYOND this cadence. Before that, every
  # drive-day was charged a full 24h of staleness, capping the whole fleet at
  # exp(-24/48) = 0.6065 against a 0.80 destructive-action floor. ADR 0002.
  expected_cadence_days: 1

# Sequence tensors for the optional LSTM branch (docs/dataset_strategy.md
# section 10.7 Feature Family G). Only consumed by `make build-sequences`
# / `make train-lstm`; the primary pipeline ignores this section entirely.
sequences:
  time_steps: 30
  time_decay_lambda: 0.1
  attributes:
    - reallocated_sector_count
    - current_pending_sector_count
    - offline_uncorrectable
    - reported_uncorrectable_errors
    - raw_read_error_rate
    - seek_error_rate
    - spin_retry_count
    - command_timeout
    - power_on_hours
    - smart_overall_health_normalized
