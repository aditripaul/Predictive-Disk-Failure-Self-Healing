version: 1

primary_horizon_days: 30
# 7 and 14 dropped 2026-11-06; 44 and 60 added for the horizon comparison
# (docs/q3_horizon_and_cascade_run.md). Above 60 days the test window is too short
# on this data (a 90-day label needs 90 days of data after the row).
horizons_days: [30, 44, 60]

model:
  type: lightgbm  # lightgbm | xgboost (src/models/training.py, src/models/xgboost_training.py)
  # Caps the primary model's training row count (pipelines/train_model.py,
  # DEFAULT_MAX_TRAIN_ROWS/_subsampled_train_lazy). At fleet scale, a real
  # quarter's train split is tens of millions of rows - even a single
  # clean copy of its feature matrix no longer fits in resource_limits.
  # max_memory_gb below. Every failure (positive-label) row is always
  # kept; negative rows are randomly subsampled down to this cap with a
  # deterministic hash(drive_id, date) seed, so a capped run is still
  # reproducible. Set to null to train on every row instead (only
  # advisable with a much higher memory cap or a smaller dataset).
  max_train_rows: 5000000
  # Positive-class weight = (n_negative / n_positive) ** positive_weight_power,
  # applied as per-row sample weights. 1.0 is the full ratio (like
  # is_unbalance); null = plain is_unbalance. On real Q1 data 0.25 / 0.5 /
  # 0.75 / is_unbalance all scored within noise (test drive AUPRC
  # 0.15-0.16) once regularized and early-stopped on average precision -
  # the regularization below is what prevents the collapse (one tree,
  # leaf values ~1e7) the first unregularized run showed.
  positive_weight_power: 0.5
  # Stop adding trees when average precision on a validation subsample
  # (every positive row + at most early_stopping_max_negatives negatives)
  # stops improving for this many rounds. null disables early stopping.
  early_stopping_rounds: 50
  early_stopping_max_negatives: 1500000
  # Second stage (src/models/two_stage.py): a second model re-ranks the
  # drive-days the first model scores highest. On since 2026-10-06, after it
  # raised precision at the strict operating points in five of five seeds
  # (docs/model_status_and_runbook.md section 4.5). Set to false for the
  # single model; `make train TRAIN_ARGS=--two-stage` forces it on for one
  # run. `make score-fleet` uses it automatically for a run trained with it.
  two_stage:
    enabled: true
    # Candidates = rows at or above the validation threshold that still
    # catches this share of failing drives. Tiers needing more recall than
    # this are unaffected by the second stage.
    # 0.8 since 2026-11-06 (was 0.5). Adopted post hoc: under the
    # pre-registered rule of docs/cascade_wide_net.md section 9.3 it failed
    # only criterion 3 (a recall dip of 3-10 of 1,479 drives, not
    # statistically established) and gained +1.9 precision points at 60%
    # recall and +4.8 at 10%. Not confirmed on data it was not chosen on
    # (docs/q3_horizon_and_cascade_run.md section 6).
    candidate_recall: 0.8
    # Train rows get their first-stage score from a model that never saw
    # their drive (this many folds), so the second stage learns from scores
    # like the ones it will meet in use.
    n_folds: 3
    seed: 0
    # Second-stage LightGBM overrides. min_child_samples 50 was set for a
    # pool of ~10k candidate rows (the 0.5 net); a wider net gives the second
    # stage up to millions of rows, where 50 is weaker regularisation than
    # the first stage's 200.
    stage2_params:
      min_child_samples: 50
    # The second stage early-stops on every positive validation candidate
    # row plus at most this many negatives (as the first stage does above).
    # Changes nothing at the 0.5 net (~20k candidates); bounds memory for a
    # wide one.
    early_stopping_max_negatives: 1500000
    # Defaults of `make experiment-model EXPERIMENT_ARGS="--two-stage ..."`:
    # the wide-net comparison (docs/model_status_and_runbook.md section 4.12).
    # Every net is compared with the first model alone at each recall level
    # up to the net, paired within each seed.
    experiment:
      # [0.5, 0.7, 0.8, 0.9] for the wide-net comparison (runbook 4.12); the
      # Q1+Q2 -> Q3 run compares the old and the adopted net.
      candidate_recalls: [0.5, 0.8]
      # Stage 2 models compared per net (docs/q3_horizon_and_cascade_run.md):
      # the shipped LightGBM classifier and two survival models on censored
      # time to failure. The survival kinds run only at survival_nets.
      stage2_kinds: [lightgbm, cox, aft]
      survival_nets: [0.8]
      # Survival Stage 2 overrides of src/models/survival.py's COX_PARAMS /
      # AFT_PARAMS: shallower trees and smaller leaves for a candidate pool of
      # ~10^5 rows, from the proposal this was checked against (depth 3-5,
      # learning rate 0.01-0.05, min_child_weight 5-10).
      survival_params:
        max_depth: 4
        learning_rate: 0.03
        min_child_weight: 10
        subsample: 0.8
        colsample_bytree: 0.7
      recall_levels: [0.05, 0.10, 0.20, 0.35, 0.50, 0.60, 0.70, 0.80]
      seeds: 3
      # A failing drive also counts as caught "with lead" only when a row at
      # least this many days before its failure clears the threshold.
      lead_min_days: 1
      # Cost of a missed failure over a false alarm. An illustration (from a
      # 1000:50 example), not a measured cost.
      cost_ratio: 20
      n_boot: 1000
  params:
    objective: binary
    num_leaves: 31
    learning_rate: 0.05
    n_estimators: 1000  # upper bound; early stopping picks the real number
    # Regularization. Every failing drive contributes ~14 near-identical
    # positive rows, so without these trees isolate individual drives.
    min_child_samples: 200
    reg_lambda: 10.0
    max_delta_step: 1.0
    feature_fraction: 0.7
    bagging_fraction: 0.8
    bagging_freq: 1

# Operating point, chosen on the validation split's DRIVE-level
# precision/recall curve (src/models/threshold.py): the highest-recall
# threshold with recall >= the range's lower bound and precision >=
# target_precision; if that goal is unreachable, the highest-precision
# threshold with recall >= the lower bound, flagged target_met: false with
# the gap recorded in the model card. The target is kept as the goal.
# Goal (revised 2026-11-10): 68% precision at >= 10% recall, per drive, on the
# output of the stacked cascade: Stage 1 LightGBM, Stage 2 a rank-blend stack of
# LightGBM and Cox (src/models/stacking.py), AT A 30-DAY HORIZON. The stack is
# compared and frozen as a scorer (frozen_runs/stack_h60_seed0) but is not part of
# make train, so make train measures the goal on the LightGBM two-stage output.
# Measured stack at 30 days: 64.9% at 11.6% recall, 3-seed mean on Q3 2026
# (docs/model_status_and_runbook.md 1.1.4a). It was 90% at >= 10% recall from 2026-10-06, and 95% at
# 35-50% recall before that; neither was reachable. The report's
# precision-at-recall table still shows 5 / 10 / 20 / 35% recall. Saved
# thresholds in frozen runs were tuned for the earlier target and change only
# when thresholds are re-tuned (make train, or scripts/freeze_stack_scorer.py).
#
# The horizon is part of the goal, not an implementation detail. Precision
# moves with the base rate and a longer label raises it mechanically: at an
# IDENTICAL operating point, doubling the positive rate takes precision from
# 48.6% to 65.5% and drops lift from 277 to 187 without the model changing.
# So a precision figure earned at 60 days does not satisfy this target and
# must never be reported in the same column as a 30-day one. Compare horizons
# in ROC space instead - drive-level auroc and recall at a matched false-alarm
# rate, both logged by make train (src/models/evaluation.py). Changing the
# horizon of the goal is a decision to record here and in Section 7 of
# docs/model_status_and_runbook.md, not something a config edit should do
# quietly.
threshold:
  target_precision: 0.68
  target_recall_range: [0.10, 0.50]
  search_metric: auprc
  # Per-agent-action precision requirements (drive level, ascending: a more
  # drastic action tolerates fewer false alarms). `make train` turns each into
  # a score threshold on the validation split (src/models/threshold.py::
  # tune_action_tiers), reports validation/test precision and recall per tier,
  # and `make score-fleet` uses those thresholds instead of the hand-picked
  # probability cutoffs in configs/agent.yaml. A tier whose target is
  # unreachable never fires. These are placeholders to be set from the real
  # cost of a false alarm per action. On the Q3 2026 test the current model's warn
  # tier reaches 17.3% precision at 60.9% recall and cordon 34.8% at 42.4%; migrate
  # and drain are not reachable (docs/system_summary.md section 4, runbook 1.9).
  # Targets are LIFT (alerted-drive failure rate / fleet failure rate), not raw
  # precision: precision moves with the base rate, which differs by split and
  # fleet, and lift does not. Lift = precision / validation drive-level failure
  # rate (0.265% on the Q1 2026 validation split when these were set; 0.59% on the
  # current holdout, where the same lifts mean higher precision targets - runbook
  # 1.9), so these reproduced the former precision targets 0.15 / 0.25 / 0.40 / 0.60
  # on the Q1 split. Thresholds are still tuned on validation only.
  action_tier_lift:
    warn: 56.6
    cordon: 94.3
    migrate: 151.0
    drain: 226.4
  # Cost-based tiers (src/models/threshold.py::tune_cost_tiers;
  # docs/agent_knowledge_base.md section 4): per action, how many unnecessary actions
  # of that kind one prevented failure is worth. Each tier is placed where its action
  # pays for itself on validation (flag while marginal precision >= 1 / (1 + r)).
  # PLACEHOLDERS: the real ratios are an operations decision, not a result. Must not
  # increase from warn to drain.
  action_cost_ratio:
    warn: 100
    cordon: 20
    migrate: 5
    drain: 2
  # Which tier set the agent acts on when it reads a precomputed scorer's thresholds
  # file: lift (action_tier_lift, the default) or cost (action_cost_ratio).
  tier_rule: lift
  # Per-family action tiers (docs/adr/0002): one fleet-wide threshold puts
  # different drive models at very different operating points, so each model
  # with at least this many FAILING validation drives also gets its own
  # thresholds from the same lift targets, converted at that model's own
  # failure rate. Below the gate a model keeps the fleet-wide thresholds -
  # recall moves in steps of 1/n on a family's curve, so a threshold fitted to
  # a handful of drives is fitted to noise. train_model reports the per-family
  # and fleet-wide thresholds side by side on test; judge it there.
  min_family_failing_drives: 50

# Optuna-based hyperparameter search (docs/project_plan.md Phase 6
# "Threshold tuning: Use Optuna. Subsample for search. Retrain best
# configuration on full training partition."). Disabled by default so
# `make train` stays fast/deterministic; enable for a real tuning run.
hyperparameter_search:
  enabled: false
  n_trials: 20
  subsample_fraction: 0.3
  seed: 0
  search_space:
    num_leaves: [15, 63]
    learning_rate: [0.01, 0.2]
    n_estimators: [100, 800]

# Subsampled SMOTE comparison (docs/dataset_strategy.md section 15
# Imbalance Mitigations #3): trains a SECOND, comparison-only model on a
# SMOTE-resampled training subsample and reports its validation AUPRC
# alongside the primary (class-weighted) model's - it never replaces the
# primary model. Disabled by default; per the docs, prefer class
# weighting unless SMOTE clearly improves validation AUPRC.
smote_comparison:
  enabled: false
  subsample_fraction: 1.0
  seed: 0

# Row caps for the two comparison/diagnostic steps that are NOT the
# primary model, and whose cost scales with the training/validation split
# size rather than being bounded by the model itself. Both are generous
# enough that any dataset smaller than the cap is unaffected (the cap
# only ever kicks in at fleet scale), and both are sampled with a fixed
# seed so a capped run is still reproducible.
diagnostics:
  # Logistic Regression sanity baseline: sklearn's StandardScaler and
  # LogisticRegression both force a float64 copy of whatever they're
  # given, so an uncapped fit on a fleet-scale training split needs
  # ~2x8.9GB on top of the primary model's own matrix. It is explicitly a
  # non-production sanity check (src/models/logistic_regression_baseline.py),
  # so fitting it on a bounded sample is the right trade.
  baseline_max_rows: 1000000
  # SHAP global feature importance (TreeExplainer on the validation
  # split). Disabled by default: on real fleet data it is slow (~30 min
  # for shap_max_rows) and fails SHAP's own additivity check whenever the
  # model has extreme leaf values. When disabled, no
  # shap_feature_importance.json is written (a stale one from an earlier
  # run is removed) and the model card records SHAP as skipped.
  shap_enabled: false
  # SHAP global feature importance is a mean over |shap value| per
  # feature, which converges long before millions of rows; TreeExplainer
  # also materializes a full (rows x features) float64 array.
  shap_max_rows: 200000

splits:
  strategy: chronological
  # CHRONOLOGICAL SPLIT WITH GAPS (2026-11-10; docs/model_status_and_runbook.md 1.1.8 and
  # 1.1.9; docs/dataset_strategy.md 9.5). Train, validation and test are consecutive
  # periods, with a gap of one label horizon at each boundary, so no label and no feature
  # statistic of an earlier period depends on a later one. Designed for the 30-day goal
  # (threshold.target_precision) on the stacked cascade; the 44- and 60-day horizons need
  # longer gaps, so `make train` refuses them while strict_separation is on.
  #
  #   train        2026-01-01 .. 2026-04-20   (train_end 05-20 minus the 30-day purge)
  #   gap          2026-04-21 .. 2026-05-20   train labels resolve; no row used
  #   validation   2026-05-21 .. 2026-06-16   thresholds, early stopping, stack weights
  #   gap          2026-06-17 .. 2026-07-16   validation labels resolve (test_embargo_days)
  #   test         2026-07-17 .. 2026-08-31   scored once, after everything is frozen
  #   (no usable row after 08-31: its 30-day label is not observed by 09-30)
  #
  # Failing drives, 30-day label (runbook 1.1.8, counted 2026-11-10): train 2,018 (to 04-20),
  # validation 684, test 864. Q4 2025 is feature history only. All drives appear in every
  # period (no drive holdout); only rows are separated by date.
  #
  # Q3 is not a fresh test set: 139 logged test looks by 2026-11-10 (runbook 1.4). The first
  # Q4 2026 download is the only fully clean test.
  #
  # The drive-holdout design of runbook 1.1.4 to 1.1.7 (frozen runs c459046e and others;
  # train 80% of drives to 05-01, validation the other 20% over the same dates, test Q3)
  # is these values; restore them and rebuild labels and gold features to repeat it:
  #   train_end 2026-05-01, validation_end 2026-05-01, test_embargo_days 0,
  #   holdout_fraction 0.2, purge_label_window false, validation_after_train_only false,
  #   feature_stats_end null, strict_separation false
  train_start: "2026-01-01"
  train_end: "2026-05-20"
  validation_end: "2026-06-16"
  # Read directly by src/agent/fleet.py and src/ingest/synthetic_stub.py.
  # make train caps the test split at min(test_end, observation_end -
  # horizon): the last row whose horizon-day label is fully observed.
  test_end: "2026-08-31"
  observation_end: "2026-09-30"
  # No test row within this many days after validation_end. A validation row's label looks
  # `horizon` days ahead, so this must be at least the horizon; the checks enforce it.
  test_embargo_days: 30
  # Which label-table split make train tests on. "sealed" = the rows dated on
  # or after sealed_start (Q3); with the embargo, test starts 07-17.
  test_split: sealed
  # Rows dated on or after this are labeled split="sealed". It no longer sets the cutoff of
  # the fleet-wide feature statistics (feature_stats_end does), but drives first seen on or
  # after it are never in the holdout pool.
  sealed_start: "2026-07-01"
  # Fleet-wide feature statistics (model-family z-scores, expected SMART attributes) use rows
  # before this date: the day after the last train row (train_end minus the 30-day horizon).
  # Changing it needs `make build-features`. null falls back to sealed_start, which includes
  # the validation period.
  feature_stats_end: "2026-04-21"
  # Share of drives (first seen before sealed_start) held out as validation
  # (pipelines/build_labels.py). 0: validation is a later period, not held-out drives.
  holdout_fraction: 0
  # Applied when `make train` extracts each split
  # (src/labels/splits.py::split_period_predicate):
  # - purge_label_window: train only on rows dated at least the label horizon
  #   before train_end (04-20), because a later row's label is decided inside validation.
  # - validation_after_train_only: validation holds only dates after train_end.
  # train_start bounds train and validation; the test cap is always applied.
  purge_label_window: true
  validation_after_train_only: true
  # true makes `make train` fail before any work if `make check-splits` would
  # (src/labels/split_checks.py): the purge and holdout flags, the embargo and statistics
  # cutoff against the horizon, and the label table's date ranges.
  strict_separation: true

sequence_model:
  window_days: 30
  # Gold feature-table columns. seek_error_rate, raw_read_error_rate and
  # spin_retry_count are left out: ADR 0002 measured them as weak (single
  # attribute separation < 0.07), and seek_error_rate is a packed vendor value.
  attributes:
    - reallocated_sector_count
    - current_pending_sector_count
    - offline_uncorrectable
    - reported_uncorrectable_errors
    - command_timeout
    - reallocation_event_count
    - power_on_hours
    - udma_crc_error_count
    - temperature_celsius
  hidden_size: 64
  num_layers: 2
  dropout: 0.1
  learning_rate: 0.002
  batch_size: 2048
  max_epochs: 12
  early_stopping_patience: 3
  # Training rows: every positive plus random negatives up to this total (the
  # tree model's model.max_train_rows is 5,000,000; an LSTM on CPU is slower per
  # row, so this is smaller). null = every row.
  max_train_rows: 3000000
  early_stopping_max_negatives: 500000
  seed: 0
  # `make train-sequence SEQUENCE_ARGS="--arch tcn"`: the dilated temporal CNN
  # of the merged approach (aryan_v2 sequence.TCN). Everything not set here
  # (window, attributes, learning rate, batch, epochs, patience, negatives cap,
  # seed) is the LSTM's, so the two differ only in architecture.
  tcn:
    hidden_size: 64
    dropout: 0.1

# Merged approach (`make train-merged`): aryan_v2's survival and sequence
# models as stages on this pipeline's frame, splits and evaluation, plus
# validation-rank blends of them with the LightGBM (two-stage) score. Reads the
# work dir and scores that `make train TRAIN_ARGS="--keep-work-dir --save-scores"`
# and `make train-sequence` (LSTM, then SEQUENCE_ARGS="--arch tcn") leave.
merged_models:
  seed: 0
  # Survival stages, trained on the train rows with outcomes censored at
  # train_end (`survival_bounds`, cutoff = last train row + horizon).
  aft:
    weighting: none          # none | spw (as experiment_model's xgboost_aft[_spw])
  cox:
    weighting: none
  num_boost_round: 1000
  early_stopping_rounds: 50
  early_stopping_max_negatives: 1500000
  # Rows must be scored by every member to be compared; fewer than this share
  # of the LightGBM rows in common fails the run instead of quietly comparing
  # different populations.
  min_join_coverage: 0.95
  # Members by name: lightgbm, aft, cox, lstm, tcn. Equal weights.
  ensembles:
    lgbm_aft_tcn: [lightgbm, aft, tcn]
    lgbm_lstm_aft_tcn: [lightgbm, lstm, aft, tcn]
  # The blend `make agent-fleet ARGS="--scores-path ..."` acts on.
  agent_ensemble: lgbm_lstm_aft_tcn

mlflow:
  tracking_uri: sqlite:///mlflow/mlflow.db
  experiment_name: disk-failure-prediction

# Reporting (pipelines/train_model.py, pipelines/experiment_model.py,
# scripts/compare_horizons.py).
evaluation:
  # Precision and recall when exactly K drives are flagged over the test
  # window, ranked by each drive's highest score (an inspection budget, not a
  # threshold). Chosen from the drive counts earlier runs flagged on a
  # ~355k-drive test fleet: about 110 at the primary threshold, 500 at 35%
  # recall, 3,100 at 60% recall, 18,000 at the 0.8 net. K counts drives over
  # the whole window, so the window length is printed beside it and horizons
  # are compared at K only on a matched window.
  top_k: [100, 250, 500, 1000, 2500, 5000]
