version: 1

primary_horizon_days: 14
horizons_days: [7, 14, 30]

model:
  type: lightgbm  # lightgbm | xgboost (src/models/training.py, src/models/xgboost_training.py)
  # Caps the primary model's training row count (pipelines/train_model.py,
  # DEFAULT_MAX_TRAIN_ROWS/_subsampled_train_lazy). At fleet scale, a real
  # quarter's train split is tens of millions of rows - even a single
  # clean copy of its feature matrix no longer fits in resource_limits.
  # max_memory_gb below. Every failure (positive-label) row is always
  # kept; negative rows are randomly subsampled down to this cap with a
  # deterministic hash(drive_id, date) seed, so a capped run is still
  # reproducible. Set to null to train on every row instead (only
  # advisable with a much higher memory cap or a smaller dataset).
  max_train_rows: 5000000
  # Positive-class weight = (n_negative / n_positive) ** positive_weight_power
  # (LightGBM scale_pos_weight). 1.0 is the full ratio (the old
  # is_unbalance); 0.5 (sqrt) is what works. On real Q1 data the full ratio
  # collapsed training to ONE tree with leaf values ~1e7 (validation drive
  # AUPRC 0.04); sqrt gave 434 normal trees and drive AUPRC 0.23 (val) /
  # 0.16 (test), ~4x the logistic baseline. null = old is_unbalance.
  positive_weight_power: 0.5
  # Stop adding trees when average precision on a validation subsample
  # (every positive row + at most early_stopping_max_negatives negatives)
  # stops improving for this many rounds. null disables early stopping.
  early_stopping_rounds: 50
  early_stopping_max_negatives: 1500000
  params:
    objective: binary
    num_leaves: 31
    learning_rate: 0.05
    n_estimators: 1000  # upper bound; early stopping picks the real number
    # Regularization. Every failing drive contributes ~14 near-identical
    # positive rows, so without these trees isolate individual drives.
    min_child_samples: 200
    reg_lambda: 10.0
    max_delta_step: 1.0
    feature_fraction: 0.7
    bagging_fraction: 0.8
    bagging_freq: 1

# Operating point, chosen on the validation split's DRIVE-level
# precision/recall curve (src/models/threshold.py): the highest-recall
# threshold with recall >= the range's lower bound and precision >=
# target_precision; if that goal is unreachable, the highest-precision
# threshold with recall >= the lower bound, flagged target_met: false with
# the gap recorded in the model card. The target is kept as the goal.
threshold:
  target_precision: 0.95
  target_recall_range: [0.35, 0.50]
  search_metric: auprc

# Optuna-based hyperparameter search (docs/project_plan.md Phase 6
# "Threshold tuning: Use Optuna. Subsample for search. Retrain best
# configuration on full training partition."). Disabled by default so
# `make train` stays fast/deterministic; enable for a real tuning run.
hyperparameter_search:
  enabled: false
  n_trials: 20
  subsample_fraction: 0.3
  seed: 0
  search_space:
    num_leaves: [15, 63]
    learning_rate: [0.01, 0.2]
    n_estimators: [100, 800]

# Subsampled SMOTE comparison (docs/dataset_strategy.md section 15
# Imbalance Mitigations #3): trains a SECOND, comparison-only model on a
# SMOTE-resampled training subsample and reports its validation AUPRC
# alongside the primary (class-weighted) model's - it never replaces the
# primary model. Disabled by default; per the docs, prefer class
# weighting unless SMOTE clearly improves validation AUPRC.
smote_comparison:
  enabled: false
  subsample_fraction: 1.0
  seed: 0

# Row caps for the two comparison/diagnostic steps that are NOT the
# primary model, and whose cost scales with the training/validation split
# size rather than being bounded by the model itself. Both are generous
# enough that any dataset smaller than the cap is unaffected (the cap
# only ever kicks in at fleet scale), and both are sampled with a fixed
# seed so a capped run is still reproducible.
diagnostics:
  # Logistic Regression sanity baseline: sklearn's StandardScaler and
  # LogisticRegression both force a float64 copy of whatever they're
  # given, so an uncapped fit on a fleet-scale training split needs
  # ~2x8.9GB on top of the primary model's own matrix. It is explicitly a
  # non-production sanity check (src/models/logistic_regression_baseline.py),
  # so fitting it on a bounded sample is the right trade.
  baseline_max_rows: 1000000
  # SHAP global feature importance (TreeExplainer on the validation
  # split). Disabled by default: on real fleet data it is slow (~30 min
  # for shap_max_rows) and fails SHAP's own additivity check whenever the
  # model has extreme leaf values. When disabled, no
  # shap_feature_importance.json is written (a stale one from an earlier
  # run is removed) and the model card records SHAP as skipped.
  shap_enabled: false
  # SHAP global feature importance is a mean over |shap value| per
  # feature, which converges long before millions of rows; TreeExplainer
  # also materializes a full (rows x features) float64 array.
  shap_max_rows: 200000

splits:
  strategy: chronological
  train_end: "2026-02-22"
  validation_end: "2026-03-06"
  test_end: "2026-03-17"

mlflow:
  tracking_uri: sqlite:///mlflow/mlflow.db
  experiment_name: disk-failure-prediction
