version: 1

checkpoint:
  backend: sqlite
  path: mlflow/agent_checkpoints.sqlite
  action_ledger_path: mlflow/agent_action_ledger.sqlite

loop:
  target_cycle_time_seconds: 300
  cooldown_seconds: 3600
  hysteresis_cycles_required: 1

human_review:
  critical_sla_hours: 1
  non_critical_sla_hours: 24
  timeout_fallback_action: cordon

# Hand-picked probability cutoffs used by the live agent loop. The model's
# probabilities are class-weighted, so these do NOT correspond to a fixed
# false-alarm rate. `make score-fleet` instead uses per-tier thresholds that
# `make train` derives from lift targets (configs/model.yaml
# threshold.action_tier_lift) and records with the model; these values
# are the fallback for models trained before that existed, and for a fresh
# checkout with no trained run: the live loop's entry points (src/agent/demo.py
# live_plan_kwargs, src/agent/fleet.py) resolve the trained thresholds through
# src/models/trained_thresholds.py and only fall back to these.
# NOTE: on the current model (frozen run c459046e) migrate and drain are not reachable:
# their trained cutoffs coincide (score 0.9264) and flag only a handful of drives, so the
# agent in practice acts through warn and cordon (docs/model_status_and_runbook.md 1.9).
action_thresholds:
  warn: 0.30
  cordon: 0.60
  migrate: 0.80
  drain: 0.90

feature_confidence:
  min_confidence_for_destructive_action: 0.80

# The share of drives the agent deliberately does NOT act on, so their
# outcomes stay uncensored (src/agent/control_arm.py).
#
# Acting censors the outcome: drain a drive that was about to fail and it
# never fails, so its label is 0, and a model retrained on that data learns
# the features that triggered the drain do not predict failure. A control arm
# is the standard fix - a small fixed share of flagged drives left alone,
# whose outcomes are unbiased labels for exactly the population that matters.
#
# 0.0 holds nothing back, which is correct while the executor is simulated
# and nothing is censored. Set it (0.02-0.05 is the usual range) BEFORE
# connecting a real executor: it costs real failures, so it is a deliberate
# trade, and it is far cheaper to decide now than to retrofit once the
# training data is already poisoned. Membership is a stable hash of the drive
# id, so the same drive is always control and the split is reconstructible
# from the id and salt alone.
control_arm:
  control_fraction: 0.0
  salt: "control-arm-v1"

# Knowledge (the K of MAPE-K; docs/agent_knowledge_base.md): a time-indexed store of what
# the loop has seen per drive and cohort, queried as of each decision's date so it never
# sees a later fact (src/agent/knowledge/). `backend: none` keeps the loop exactly as
# before; `sqlite` / `memory` attach a store that annotates candidates and records
# decisions, which feed outcome resolution and final trust scores. It changes no decision:
# `rule` stays `none` unless a rule passes the pre-registered screen (section 8). None has.
knowledge:
  backend: none
  path: data/audit/agent_knowledge.sqlite
  rule: none
